<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портал компании</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Портал компании</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'news' %}">Новости</a>
                <a class="nav-link" href="{% url 'do' %}">Деятельность</a>
                <a class="nav-link" href="user/rating.html">Оценка</a>
                <a class="nav-link" href="user/wiki.html">Вики</a>
                <a class="nav-link" href="user/templates.html">Шаблоны</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <h1>Добро пожаловать!</h1>
        <p>Выберите раздел в меню для работы.</p>
    </div>

</body>
</html>
