<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'main_page' %}">Портал компании</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'news' %}">Новости</a>
                <a class="nav-link" href="{% url 'do' %}">Деятельность</a>
                <a class="nav-link" href="rating.html">Оценка</a>
                <a class="nav-link" href="wiki.html">Вики</a>
                <a class="nav-link" href="templates.html">Шаблоны</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Новости компании</h2>
        <div id="newsList"></div>
    </div>

    <script>
        async function loadNews() {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/news', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const news = await response.json();
                const newsList = document.getElementById('newsList');
                newsList.innerHTML = news.map(item => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${item.title}</h5>
                            <p class="card-text">${item.content}</p>
                            <small class="text-muted">${new Date(item.created_at).toLocaleDateString()}</small>
                        </div>
                    </div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', loadNews);
    </script>
</body>
</html>
